tagrule=id:1,layout_name:monocle
tagrule=id:2,layout_name:tile

windowrule=tags:2,appid:foot(client)?

windowrule=isfloating:1,appid:flameshot,title:flameshot
windowrule=move:0 0,appid:flameshot,title:flameshot
windowrule=animation_type_open:none,appid:flameshot,title:flameshot
windowrule=animation_type_close:none,appid:flameshot,title:flameshot

monitorrule=name:.*HDMI-.*-1.*,width:1920,height:1080,refresh:60,x:0,y:0,allow_tearing:2
